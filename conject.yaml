# Conject project configuration.
# Commit this file. Keep credentials in environment variables or ignored .conject/ auth files.
# Pi runtime state and OAuth credential storage are Conject-owned and must stay under .conject/.
# Use research.preset as the plain-language starting point, then edit numeric limits as needed.
version: 1
research:
  preset: quick
  ideas: 3
  sourcesPerIdea: 2
  researcherParallelism: 2
  webQueries: 2
  webFetches: 3
  fetchOpenAccessPdfs: true
providers:
  paper:
    openAlex:
      enabled: true
    semanticScholar:
      enabled: true
      apiKeyEnv: SEMANTIC_SCHOLAR_API_KEY
    arxiv:
      enabled: true
  web:
    enabled: true
    primary: tavily
    tavily:
      enabled: true
      apiKeyEnv: TAVILY_API_KEY
    searxng:
      enabled: false
runtime:
  default: mock
  pi:
    useSdk: true
    agentDir: .conject/pi
models:
  default:
    provider: openai-codex
    model: gpt-5.5
    thinking: xhigh
    auth:
      type: openai-codex
      storagePath: .conject/pi/auth.json
  agents: {}
scoring:
  impact: 0.25
  testability: 0.25
  evidenceStrength: 0.2
  novelty: 0.15
  implementationDifficulty: -0.15
budgets:
  strategist:
    maxToolCalls: 0
    timeoutMs: 120000
    maxOutputTokens: 4000
  researcher:
    maxToolCalls: 20
    timeoutMs: 300000
    maxOutputTokens: 8000
  reviewer:
    maxToolCalls: 5
    timeoutMs: 180000
    maxOutputTokens: 6000
  builder:
    maxToolCalls: 30
    timeoutMs: 300000
    maxOutputTokens: 8000
